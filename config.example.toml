[account]
# Email of the LibreLinkUp follower account (the one doing the watching).
email = "you@example.com"

# LibreLinkUp password.
# Do not share this file or commit it; .gitignore already excludes it.
password = ""

# Leave empty when you follow exactly one person; it is detected then.
# Set it only if you follow several.
patient_id = ""

# Leave empty to use whatever region login redirects to. "jp" for Japan.
region = ""

# Raise this when Abbott starts rejecting the version we send. A rejected
# version shows up as a 4xx on login; match whatever the current release
# of LibreLinkUpDesktop or pylibrelinkup sends.
api_version = "4.16.0"


# Everything in this section is re-read while the app runs, except
# `hand`. Edit and save with the headset on and the face moves within a
# second; see "Tuning" in README.md.
[display]
unit = "mgdl"        # "mgdl" or "mmol"
hand = "left"        # which controller to follow; the off hand works best
width_m = 0.14       # overlay width in metres

# Ride around the forearm instead of being bolted to the controller, so
# that turning your hand cannot push the face into your arm. Recommended;
# see "Orbit mode" in README.md, which also explains what offset and
# rotation_deg mean once this is on.
orbit = false
orbit_radius_m = 0.06    # how far off the arm's centreline the face floats
orbit_limit_deg = 120.0  # how far round the arm it may travel from the top

# Draw the arm orbit mode is aiming at: a cyan line down the modelled
# centreline and magenta dots on the circle the face travels. Turn it on
# while setting offset, off once it is right. See "Orbit mode" in README.md.
arm_guide = false

# Position relative to the controller, in metres: 0.01 is one centimetre.
# Point the controller away from you like a torch, then
#   X: + right          Y: + up, off the back of the hand
#   Z: + back towards the elbow
# With orbit on this is a point on the arm's centreline, so Y usually goes
# negative: try [0.0, -0.02, 0.10].
offset = [0.0, 0.02, 0.10]

# Tilt in degrees, applied X, then Y, then Z.
#   X: - stands the face up towards your eyes, + lays it flat on the arm
#   Y: swings it left and right
#   Z: spins it in place; try 90 or -90 if the digits run across the arm
# With orbit on the aiming is done for you, so start from [0, 0, 0] and use
# these only to trim.
rotation_deg = [-40.0, 0.0, 0.0]

opacity = 1.0
flip_vertical = false   # set true if the face renders upside down
stale_after_min = 10.0  # readings older than this go grey


[thresholds]
# All mg/dL. These are used even when displaying mmol/L.
# The face is red below low, green up to high, yellow up to very_high,
# and deep orange above it.
low_mgdl = 70
high_mgdl = 180
very_high_mgdl = 240


# How the trend arrow is worked out. Re-read while running, like
# [display], so the two can be compared with the headset on.
[trend]
# true:  fit the slope from the recent history this app already
#        receives, so the arrow points at the actual rate of change.
# false: use Abbott's own TrendArrow, the same five positions the phone
#        app shows. Pick this to have both screens agree exactly.
# Even with this on, the API value is the fallback whenever there is too
# little history to fit -- a fresh sensor, or a gap in scanning.
local = true

window_min = 15.0    # how far back the slope is fitted over; at least 5

# All mg/dL per minute, and ignored while local = false. flat is where
# the arrow reaches 45 degrees and fast is where it stands fully
# vertical; between them it slides. Lower them to make the arrow react
# harder to a slow drift.
flat_mgdl_min = 1.0
fast_mgdl_min = 2.0


[polling]
interval_sec = 60    # must be at least 30; the sensor updates ~once a minute
alert_on_low = true  # buzz the controller once when a low starts
