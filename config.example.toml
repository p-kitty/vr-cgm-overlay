[account]
# Email of the LibreLinkUp follower account (the one doing the watching).
email = "you@example.com"

# LibreLinkUp password.
# Do not share this file or commit it; .gitignore already excludes it.
password = ""

# Leave empty when you follow exactly one person; it is detected then.
# Set it only if you follow several.
patient_id = ""

# Leave empty to use whatever region login redirects to. "jp" for Japan.
region = ""

# Raise this when Abbott starts rejecting the version we send. A rejected
# version shows up as a 4xx on login; match whatever the current release
# of LibreLinkUpDesktop or pylibrelinkup sends.
api_version = "4.16.0"


# Everything in this section is re-read while the app runs, except
# `hand`. Edit and save with the headset on and the face moves within a
# second; see "Tuning" in README.md.
[display]
unit = "mgdl"        # "mgdl" or "mmol"
hand = "left"        # which controller to follow; the off hand works best
width_m = 0.14       # overlay width in metres

# Ride around the forearm instead of being bolted to the controller, so
# that turning your hand cannot push the face into your arm. Recommended;
# see "Orbit mode" in README.md, which also explains what offset and
# rotation_deg mean once this is on.
orbit = false
orbit_radius_m = 0.06    # how far off the arm's centreline the face floats
orbit_limit_deg = 120.0  # how far round the arm it may travel from the top

# Draw the arm orbit mode is aiming at: a cyan line down the modelled
# centreline and magenta dots on the circle the face travels. Turn it on
# while setting offset, off once it is right. See "Orbit mode" in README.md.
arm_guide = false

# Position relative to the controller, in metres: 0.01 is one centimetre.
# Point the controller away from you like a torch, then
#   X: + right          Y: + up, off the back of the hand
#   Z: + back towards the elbow
# With orbit on this is a point on the arm's centreline, so Y usually goes
# negative: try [0.0, -0.02, 0.10].
offset = [0.0, 0.02, 0.10]

# Tilt in degrees, applied X, then Y, then Z.
#   X: - stands the face up towards your eyes, + lays it flat on the arm
#   Y: swings it left and right
#   Z: spins it in place; try 90 or -90 if the digits run across the arm
# With orbit on the aiming is done for you, so start from [0, 0, 0] and use
# these only to trim.
rotation_deg = [-40.0, 0.0, 0.0]

# Dim the face while you are not looking at it, so a number you want
# glanceable is not also permanently in the corner of your eye. Off by
# default; see "Gaze mode" in README.md. It never fades to nothing, and
# never at all while a reading is low.
gaze_fade = false
gaze_full_deg = 20.0    # within this of the centre of view: full opacity
gaze_fade_deg = 45.0    # past this: gaze_min_alpha, with a fade between
gaze_min_alpha = 0.25   # how much is left when you look away; at least 0.1

opacity = 1.0
flip_vertical = false   # set true if the face renders upside down
stale_after_min = 10.0  # readings older than this go grey


# Only `vr-cgm-overlay --window` reads this section: the same watch face
# in a desktop window instead of on a controller. The overlay ignores it,
# the same way the window ignores every placement key above. Both are
# re-read while running.
[window]
# Size, as a multiple of the face's own 512x256. Between 0.25 and 4.0.
scale = 1.0

# Keep the window above whatever else you are using. It is a glucose
# readout, so having to go and find it defeats the point.
always_on_top = true


[thresholds]
# All mg/dL. These are used even when displaying mmol/L.
# The face is red below low, green up to high, yellow up to very_high,
# and deep orange above it.
low_mgdl = 70
high_mgdl = 180
very_high_mgdl = 240


# How the trend arrow is worked out. Re-read while running, like
# [display], so the two can be compared with the headset on.
[trend]
# true:  fit the slope from the recent history this app already
#        receives, so the arrow points at the actual rate of change.
# false: use Abbott's own TrendArrow, the same five positions the phone
#        app shows. Pick this to have both screens agree exactly.
# Even with this on, the API value is the fallback whenever there is too
# little history to fit -- a fresh sensor, or a gap in scanning.
local = true

# How far back the slope is fitted over. The API sends history at one
# point every 15 minutes, so this has to span several of them: 45 is the
# floor and anything shorter is rejected. Longer is steadier and slower
# to notice a turn.
window_min = 60.0

# The rate, in mg/dL per minute, at which the arrow stands straight up.
# Everything slower is in proportion, so half of this is the 45 degree
# diagonal. Lower it to make the arrow react harder to a slow drift.
# Ignored while local = false.
fast_mgdl_min = 2.0


[polling]
interval_sec = 60    # must be at least 30; the sensor updates ~once a minute

# The master switch for announcing a low. The channels under it are
# supplements: the face going red is the alert, and neither of these is
# a substitute for looking at it.
alert_on_low = true

# Buzz the controller. Only the VR overlay has one, and the call is the
# legacy haptic API that a driver is free to ignore -- it does nothing
# on a Quest 3 through Virtual Desktop. Harmless to leave on.
alert_haptic = true

# Play a sound. This is the one channel that reaches you without looking
# at your wrist, and it works the same in VR and in --window.
alert_sound = true

# Empty plays your Windows "Exclamation" sound. Set it to a .wav to use
# your own -- forward slashes, and only .wav, since anything else would
# need a decoder this does not carry.
sound_path = ""

# After the alert fires, how far the reading has to climb back before
# the NEXT low is treated as a new one worth announcing. It is a margin
# on top of low_mgdl, so with low_mgdl = 70 the recovery mark is 75:
#
#   68  -> rings
#   71  -> silent: over 70, but not back to 75, so this is still the
#          same low rather than a new one
#   76  -> recovered; the next dip counts again
#   68  -> rings
#
# Without it (0) a reading drifting around the threshold rings on every
# crossing, and the sensor's own noise is a couple of mg/dL, so 69-71-69
# is an ordinary thing for it to do. This only changes when the sound
# fires; the face turns red at low_mgdl either way.
rearm_margin_mgdl = 5.0

# 0 fires once, on the way in. Set it to a number of minutes to be told
# again while the low lasts -- worth it if sleeping through one is the
# worry, at the cost of the nuisance that gets alerts muted. Must be at
# least 1: a new reading only arrives about once a minute.
repeat_every_min = 0.0
