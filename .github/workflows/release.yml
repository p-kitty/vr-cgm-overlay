# Build the Windows app and publish it as a GitHub release, when a
# version tag is pushed -- and at no other time.
#
# A release is something people download and click through an unsigned
# program warning to install, so it happens when somebody decides it
# should rather than on every push:
#
#   1. write the release's changes into .github/release-notes.md
#   2. bump `version` in pyproject.toml, commit, merge
#   3. git tag v0.2.0 && git push origin v0.2.0
#
# The notes file holds what changed in that one release and nothing
# else. How to install and update is in README, where somebody arriving
# later can still find it; repeating it on every release page buries the
# one thing the page is for.
#
# The tag has to match that version, or this stops before building: a
# zip named v0.2.0 that reports itself as 0.1.0 is a bug report nobody
# can make sense of.
#
# The same checks as test.yml run first, on the same clean install, so a
# release is never built from code that fails them.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Tag matches pyproject.toml
        shell: python
        run: |
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match pyproject.toml version {version}")

      - name: Install
        run: python -m pip install ".[vr,build]"

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Build
        run: python tools/build_exe.py

      # The folder inside the zip keeps its name, so extracting it
      # anywhere gives one vr-cgm-overlay folder rather than a spill of
      # _internal and an .exe into Downloads.
      - name: Zip
        run: Compress-Archive -Path dist/vr-cgm-overlay -DestinationPath "vr-cgm-overlay-${{ github.ref_name }}-windows.zip"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "vr-cgm-overlay-${{ github.ref_name }}-windows.zip"
          --title "${{ github.ref_name }}"
          --notes-file .github/release-notes.md
